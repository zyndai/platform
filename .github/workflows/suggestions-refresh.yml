# People search Phase 2: store every claimed card's top people to meet (cards.card_suggestions),
# so the morning digest and owner home read a row instead of running searches per owner.
#
# 23:30 UTC is 05:00 IST, before the first digests go out at 07:00 local; owners further west
# get theirs later the same UTC day. cards-api recomputes live when a stored list is over 36h
# old or the tables are missing (packages/db cards 0031 not applied yet), so a skipped run only
# costs speed. Reuses the morning-digest secrets (CRON_SECRET, CARDS_API_URL); no new ones.
name: suggestions-refresh

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suggestions-refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh suggestions (prod)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CARDS_API: ${{ secrets.CARDS_API_URL }}
        run: |
          test -n "$CRON_SECRET" && test -n "$CARDS_API" || { echo "Cards secrets are not configured; skipping"; exit 0; }
          curl --max-time 1800 -fsS -X POST "${CARDS_API%/}/internal/suggestions/refresh" \
            -H "Authorization: Bearer ${CRON_SECRET}"
