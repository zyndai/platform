# Production: one box runs everything. Caddy terminates HTTPS for api.zynd.ai and
# proxies to the API. Postgres/Redis are internal only (not exposed to the internet).
#
# Run from the monorepo root:
#   docker compose -f infra/api-box/docker-compose.prod.yml up -d --build
# Build contexts and env_files are relative to THIS file's location
# (infra/api-box/), pointing back into services/*. Each service keeps its own
# .env.prod alongside its code (services/memory/.env.prod,
# services/cards-api/.env.prod) — copy the existing box env files there when
# cutting over from the old standalone-repo checkouts.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zynd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zynd}
      POSTGRES_DB: zynd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zynd -d zynd"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../services
      dockerfile: memory/Dockerfile
    env_file: ../../services/memory/.env.prod
    command: sh -c "python -m app.schema_apply && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ../../services
      dockerfile: memory/Dockerfile
    env_file: ../../services/memory/.env.prod
    command: arq app.worker.WorkerSettings
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  chatgpt-plugin:
    build:
      context: ../../services
      dockerfile: memory/Dockerfile
    env_file: ../../services/memory/.env.prod
    command: uvicorn server:app --app-dir /chatgpt-plugin --host 0.0.0.0 --port 8091
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  claude-plugin:
    build:
      context: ../../services
      dockerfile: memory/Dockerfile
    env_file: ../../services/memory/.env.prod
    command: uvicorn claude_server:app --app-dir /claude-plugin --host 0.0.0.0 --port 8092
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  mcp:
    build:
      context: ../../services
      dockerfile: memory/Dockerfile
    env_file: ../../services/memory/.env.prod
    # CARDS_API_BASE_URL / FEATURE_S11_PUBLIC_MCP come from .env.prod when enabling S11.
    # Default cards reachability on the compose network:
    environment:
      CARDS_API_BASE_URL: ${CARDS_API_BASE_URL:-http://cards:8000}
    command: uvicorn app.mcp_http:app --host 0.0.0.0 --port 8090
    depends_on:
      postgres: { condition: service_healthy }
      cards: { condition: service_started }
    restart: unless-stopped

  # Zynd agent profile cards API — a sibling service in this monorepo, merged
  # into this compose so Caddy can reach it over the shared network.
  cards:
    build:
      context: ../../services/cards-api
    env_file: ../../services/cards-api/.env.prod
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
