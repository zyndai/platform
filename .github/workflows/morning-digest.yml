# Pokes cards-api to email owners today's suggested posts + people, at 07:00 in each
# owner's own timezone (stored by cards-web when they open /home; owners without one get
# 07:00 IST, cards-api's DIGEST_DEFAULT_TIMEZONE).
#
# This runs every 30 minutes and cards-api decides who is due: owners whose local time is
# between 07:00 and 10:00 and who haven't had today's (local-date) digest yet. Repeated
# ticks are therefore safe, and a late or skipped GitHub run still delivers within the
# window. 30 minutes lands whole-hour and half-hour zones (IST is UTC+5:30) exactly on
# 07:00; quarter-hour zones such as Nepal (UTC+5:45) get it up to 15 minutes late.
#
# SMTP stays on the API box. This workflow only sends CRON_SECRET.
# Prod only: dev shares prod's database, so a dev run would email the same real owners.
# GitHub only runs schedules from the default branch, so this takes effect once it is on main.
#
# Secrets (repo Settings → Secrets → Actions):
#   CRON_SECRET     — same value as cards-api CRON_SECRET
#   CARDS_API_URL   — public prod cards-api origin, no trailing slash
#                     (https://cards.api.zynd.ai; not localhost, the runner is in
#                     GitHub's cloud)
name: morning-digest

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      ignore_schedule:
        description: "Send to every owner now, whatever their local time (still once per local day)"
        type: boolean
        default: false

permissions:
  contents: read

# Two overlapping runs could both email an owner the cards-api hasn't marked yet.
concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning digest (prod)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CARDS_API: ${{ secrets.CARDS_API_URL }}
          IGNORE_SCHEDULE: ${{ inputs.ignore_schedule && 'true' || 'false' }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET secret is empty"; exit 1; }
          test -n "$CARDS_API" || { echo "CARDS_API_URL secret is empty"; exit 1; }
          curl --max-time 900 -fsS -X POST "${CARDS_API%/}/internal/morning-digest?ignore_schedule=${IGNORE_SCHEDULE}" \
            -H "Authorization: Bearer ${CRON_SECRET}"
