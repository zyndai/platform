# Weekly delivery runs on the production server (infra/single-box/crontab).
# Keep this workflow available only for explicit manual owner-notification runs.
name: owner-notifications
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-notifications
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Scan owner notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CARDS_API: ${{ secrets.CARDS_API_URL }}
        run: |
          test -n "$CRON_SECRET" && test -n "$CARDS_API" || { echo "Owner notification secrets are not configured; skipping"; exit 0; }
          curl --max-time 900 -fsS -X POST "${CARDS_API%/}/internal/owner-notifications" \
            -H "Authorization: Bearer ${CRON_SECRET}"
