# packages/db: the shared aafo schema. Proves on every change that the
# migrations apply from an empty database and that src/schema and the
# migrations agree. Never deploys anything: prod migrations are applied by a
# person (packages/db/README.md).
name: db

on:
  pull_request:
    paths: ['packages/db/**', '.github/workflows/db.yml']
  push:
    branches: [dev]
    paths: ['packages/db/**', '.github/workflows/db.yml']

jobs:
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/db
    services:
      postgres:
        # Same major version as Supabase aafo (17), with pgvector for the cards migrations.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCRATCH_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CI_DB_URL: postgresql://postgres:postgres@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/db/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Snapshot/journal consistency
        run: npx drizzle-kit check
      - name: Migration hygiene
        run: npm run db:lint
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - name: Apply every migration to an empty database
        run: |
          psql "$SCRATCH_URL" -v ON_ERROR_STOP=1 -c 'create database ci'
          psql "$CI_DB_URL" -v ON_ERROR_STOP=1 -f test/supabase-stubs.sql
          DATABASE_URL="$CI_DB_URL" npm run db:migrate -- --yes
      - name: Schema and migrations are in sync
        run: |
          npx drizzle-kit generate --name ci_should_be_empty
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "src/schema has changes with no migration. Run: npm run db:generate -- --name <owner>_<change>"
            git status --porcelain migrations
            exit 1
          fi
      - name: Drift check against a fresh build (self-consistency)
        run: npm run db:drift -- --expected "$CI_DB_URL" --scratch "$SCRATCH_URL"
